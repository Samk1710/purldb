name: Scan Docker image vulnerabilities

on:
  workflow_dispatch:
  schedule:
    # Run weekly
    - cron: '0 0 * * 0'
  push:
    branches: # add temporarily for testing on fork
        scancode-next-add-docker-scan 
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'setup.cfg'
      - '.github/workflows/scan-docker-vulnerabilities.yml'

jobs:
  scan-docker:
    name: Inspect Docker image with ScanCode.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build Docker image locally
        run: docker build -t purldb:scan .

      - name: Save Docker image archive for ScanCode.io
        run: |
          mkdir -p scancode-inputs
          docker save purldb:scan -o scancode-inputs/purldb-image.tar

      - name: Scan docker image and fail on known vulnerabilities
        uses: aboutcode-org/scancode-action@76777db8400d719de67ba3e465c5881037b45cb9  # v0.1
        with:
          pipelines: "analyze_docker_image,find_vulnerabilities"
          check-compliance: true
          compliance-fail-on-vulnerabilities: true
          outputs-archive-name: "purldb-docker-vulnerabilities-scan"
        env:
          VULNERABLECODE_URL: https://public.vulnerablecode.io/
          VULNERABLECODE_API_KEY: ${{ secrets.VULNERABLECODE_API_KEY }}

